name: score-pr

# Scores a PR's Juice Shop patch. Runs INSIDE the scorer container (node+npm), builds
# and starts the PR app in the background on localhost:3000 — no docker, no services.
#
# ⚠️ SECURITY: pull_request_target runs with the BASE repo's GITHUB_TOKEN while the PR is
# UNTRUSTED code. Here `npm install` (lifecycle scripts) and `npm start` EXECUTE that
# untrusted code in the same container as the token. The token is read-only
# (contents+packages: read) and there is no docker socket, so blast radius is small — but
# this is the deliberate trade for a docker-less, services-less run.
on:
  pull_request_target:
    branches: [dc34-ctf]

permissions: {}

jobs:
  score-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    # The job runs inside the scorer image; `score` is on PATH and npm/node come from the base.
    container:
      image: ghcr.io/owasp-ctf/score:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      # Force Juice Shop Safety Mode OFF so every vulnerability is live.
      NODE_CONFIG: '{"challenges":{"safetyMode":"disabled"}}'
      SCORE_API_URL: ${{ vars.SCORE_API_URL }}

    steps:
      - name: Check out the PR head (untrusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install dependencies
        run: npm install

      - name: Start Juice Shop in the background
        run: |
          nohup npm start > /tmp/juice-shop.log 2>&1 &
          echo "Started Juice Shop (pid $!)"

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 120); do
            if node -e "fetch('http://localhost:3000/rest/admin/application-version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "App is up after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          echo "::error::App did not become healthy in time"
          tail -n 50 /tmp/juice-shop.log || true
          exit 1

      - name: Score the patched app
        run: |
          # CTF_UPSTREAM_DIR points the scorer at the PR checkout so the static
          # source-analysis challenges (08, 09, 12) can read the PR's TypeScript.
          # Use the in-container $GITHUB_WORKSPACE (not ${{ github.workspace }}, which
          # is the host path) — the checkout lives there.
          export CTF_UPSTREAM_DIR="$GITHUB_WORKSPACE"
          rc=0
          score --verbose --url http://localhost:3000 || rc=$?
          # Exit code = number of still-open challenges (0 = all patched); a partial patch is
          # EXPECTED to be non-zero. Only a real launch failure (>=100) should fail the job.
          if [ "$rc" -ge 100 ]; then
            echo "::error::scorer failed to run (exit $rc)"; exit "$rc"
          fi
          echo "Scorer finished: $rc challenge(s) still open."

      # Expose the per-job Actions runtime token (ACTIONS_RUNTIME_TOKEN) as a step output.
      # Its `iss` is token.actions.githubusercontent.com, which the backend's auth verifies.
      - name: Get Actions identity token
        id: identity
        if: always()
        uses: cnuss/actions-identity@v1

      # Best-effort postback of the machine-readable score to the hosted backend for async
      # processing. Telemetry only — a failure here must never fail the scoring job.
      - name: Post score to backend
        if: always()
        env:
          # GITHUB_TOKEN is not a default env var in run steps; the rest are auto-injected.
          GITHUB_TOKEN: ${{ github.token }}
          # pull_request_target: GITHUB_SHA/REF point at the base; carry the PR head too.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          file="$GITHUB_WORKSPACE/ctf-score.json"
          if [ ! -s "$file" ]; then
            echo "::warning::no ctf-score.json to post"; exit 0
          fi
          if [ -z "$SCORE_API_URL" ]; then
            echo "::warning::SCORE_API_URL not set; skipping postback"; exit 0
          fi
          curl --fail --silent --show-error --max-time 15 \
            -X POST "${SCORE_API_URL%/}/score" \
            -H "Authorization: Bearer ${{ steps.identity.outputs.token }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Token: ${GITHUB_TOKEN}" \
            -H "X-GitHub-Repository: ${GITHUB_REPOSITORY}" \
            -H "X-GitHub-Ref: ${GITHUB_REF}" \
            -H "X-GitHub-Sha: ${GITHUB_SHA}" \
            -H "X-GitHub-Actor: ${GITHUB_ACTOR}" \
            -H "X-GitHub-Event-Name: ${GITHUB_EVENT_NAME}" \
            -H "X-GitHub-Workflow: ${GITHUB_WORKFLOW}" \
            -H "X-GitHub-Run-Id: ${GITHUB_RUN_ID}" \
            -H "X-GitHub-Run-Attempt: ${GITHUB_RUN_ATTEMPT}" \
            -H "X-GitHub-Pr-Number: ${PR_NUMBER}" \
            -H "X-GitHub-Pr-Head-Sha: ${PR_HEAD_SHA}" \
            --data @"$file" \
            && echo "score postback ok" \
            || echo "::warning::score postback failed (best-effort, ignored)"

      - name: Ensure a score file exists
        if: always()
        run: |
          # score writes ctf-score.md to $GITHUB_WORKSPACE; guarantee one exists so the
          # comment job always has something to post even if the scorer crashed.
          if [ ! -s "$GITHUB_WORKSPACE/ctf-score.md" ]; then
            printf '## CTF Patch Score\n\nThe score run produced no output — check the [job log](%s/%s/actions/runs/%s).\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" \
              > "$GITHUB_WORKSPACE/ctf-score.md"
          fi

      - name: Upload the score table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctf-score
          path: ctf-score.md
          if-no-files-found: error

  # Privileged job that posts the score to the PR. Runs NONE of the PR's code — it only
  # downloads the rendered table and upserts a marker comment.
  comment:
    needs: score-pr
    # Opt-in: the table reveals which flags are solved (solution hints), so posting is OFF
    # unless the repo variable CTF_POST_COMMENT is 'true'. always() so a partial/failed
    # score still comments.
    if: ${{ always() && vars.CTF_POST_COMMENT == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download the score table
        uses: actions/download-artifact@v4
        with:
          name: ctf-score
          path: score-out

      - name: Upsert the score comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ctf-score -->';
            const file = 'score-out/ctf-score.md';
            const body = `${marker}\n` + (fs.existsSync(file)
              ? fs.readFileSync(file, 'utf8')
              : 'CTF score run produced no output.');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
