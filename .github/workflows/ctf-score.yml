# ─────────────────────────────────────────────────────────────────────────────
# CTF patch scoring for external PRs against the dc34-ctf branch.
#
# Behavioural scoring with the rubric kept SECRET:
#   - the contestant's patched Juice Shop runs in its OWN sandbox container,
#   - the PRIVATE score image (challenge tests baked in) probes it over an isolated
#     docker network and never shares a filesystem or credential with it,
#   - so the untrusted patch can neither read the tests nor steal the pull token.
#
# Prerequisites:
#   1. Inherited upstream workflows removed on dc34-ctf (issue #1) → this is the only
#      workflow on a CTF PR.
#   2. ghcr.io/owasp-ctf/score:latest is PRIVATE and has the challenge tests + write-ups
#      BAKED INTO the binary (sibling repo issue #7). Until that ships, scoring is empty.
#   3. The score package grants READ access to this repo so GITHUB_TOKEN can pull it:
#      GHCR → org OWASP-CTF → Packages → score → Package settings →
#      Manage Actions access → add OWASP-CTF/juice-shop (Read).
#
# ── SECURITY (pull_request_target + untrusted code) ──────────────────────────────
# pull_request_target runs with the BASE repo's GITHUB_TOKEN. Booting a PR's patch means
# running attacker-controlled code, so it is fully sandboxed:
#   - The patched app runs in a container with NO docker socket, NO mounted secrets, NO
#     test files, on an `--internal` (egress-denied) network. It never sees the GHCR login
#     credential, which lives only on the host job — so it cannot pull the private image
#     or read the rubric.
#   - The `score` job has contents:read + packages:read only — NO pull-requests:write.
#   - A separate `comment` job (the only one with pull-requests:write) posts the result and
#     never checks out or runs PR code.
# Pin the image by digest (ghcr.io/owasp-ctf/score@sha256:…) for tamper-evident runs.
# For first-time-contributor gating, add an `environment:` with required reviewers below.
# ─────────────────────────────────────────────────────────────────────────────
name: ctf-score

on:
  pull_request_target:
    branches: [dc34-ctf]
    types: [opened, synchronize, reopened]

concurrency:
  group: ctf-score-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ── 1. Build + sandbox the patched app, then score it. Runs UNTRUSTED code.
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read   # checkout the PR head
      packages: read   # pull the private score image
    steps:
      - name: Check out PR head (UNTRUSTED — the patched app source)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: app
          persist-credentials: false

      - name: Log in to GHCR (host-only — to pull the PRIVATE score image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull the private score image (rubric baked in)
        run: docker pull ghcr.io/owasp-ctf/score:latest

      - name: Build the patched Juice Shop image (untrusted Dockerfile, isolated build)
        run: docker build -t ctf-app:pr ./app

      - name: Create an isolated, egress-denied network
        run: docker network create --internal ctf

      - name: Start the patched app sandboxed (no creds, no tests, no docker socket)
        run: |
          docker run -d --name ctf-app \
            --network ctf --network-alias app \
            --security-opt no-new-privileges \
            ctf-app:pr

      - name: Wait for the patched app to become healthy
        run: |
          docker run --rm --network ctf ghcr.io/owasp-ctf/score:latest sh -c '
            for i in $(seq 1 180); do
              if node -e "fetch(\"http://app:3000/rest/admin/application-version\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "app healthy after ${i}s"; exit 0
              fi
              sleep 1
            done
            echo "::error::patched app did not become healthy within 180s"; exit 1
          '

      - name: Score the patch (private scorer probes the app over the network)
        continue-on-error: true # the table should render even on partial failure
        run: |
          mkdir -p out
          docker run --rm --network ctf \
            -e GITHUB_WORKSPACE=/out -w /out \
            -v "$GITHUB_WORKSPACE/out:/out" \
            ghcr.io/owasp-ctf/score:latest \
            score --url http://app:3000

      - name: Dump app logs on failure
        if: failure()
        run: docker logs ctf-app || true

      - name: Tear down the app
        if: always()
        run: docker rm -f ctf-app || true

      - name: Ensure a score file exists
        if: always()
        run: |
          mkdir -p out
          if [ ! -s out/ctf-score.md ]; then
            printf '## CTF Patch Score\n\nThe score run produced no output — see the [job log](%s/%s/actions/runs/%s).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > out/ctf-score.md
          fi

      - name: Upload score result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctf-score
          path: out/ctf-score.md
          if-no-files-found: error

  # ── 2. Post the score. TRUSTED: never runs PR code; only job with pull-requests:write.
  comment:
    needs: score
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download score result
        uses: actions/download-artifact@v4
        with:
          name: ctf-score
          path: result

      - name: Upsert score comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ctf-score-comment -->';
            const file = 'result/ctf-score.md';
            const table = fs.existsSync(file)
              ? fs.readFileSync(file, 'utf8')
              : 'CTF score run produced no output.';
            const body = `${marker}\n\n${table}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
